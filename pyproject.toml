[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stylet"
version = "0.1.0"
description = "Compress, standardise, crop and split camera video for downstream analysis of behavioural experiments."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Koen Freerks"}]
dependencies = ["PySide6>=6.5"]          # the GUI; --headless needs only the standard library
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/KoenFreerks/stylet"

[project.scripts]
stylet = "stylet:main"

[tool.setuptools]
py-modules = ["stylet", "stylet_core", "stylet_gui"]
